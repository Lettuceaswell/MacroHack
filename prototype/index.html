<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MacroHack — Grey Box</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 700px; margin: 0 auto; }
  h1 { font-size: 16px; color: #888; }
  .hud { display: flex; gap: 20px; margin-bottom: 20px; padding: 10px; background: #1a1a1a; border: 1px solid #333; }
  .hud div { font-size: 13px; }
  .cards { display: flex; gap: 12px; }
  .card { border: 1px solid #555; padding: 12px; width: 200px; cursor: pointer; background: #1a1a1a; }
  .card:hover { border-color: #6cf; background: #222; }
  .card h3 { margin: 0 0 8px 0; font-size: 14px; }
  .card .stat { font-size: 12px; color: #aaa; }
  .log { margin-top: 20px; font-size: 12px; color: #8f8; white-space: pre-wrap; border-top: 1px solid #333; padding-top: 10px; }
  .end-win { color: #6f6; font-size: 15px; }
  .end-fail { color: #f66; font-size: 15px; }
  .pace-ok { color: #6f6; }
  .pace-behind { color: #fa6; }
  button { font-family: monospace; background: #222; color: #eee; border: 1px solid #555; padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #6cf; }
  button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>
  <h1>MACROHACK — grey box prototype</h1>
  <div class="hud" id="hud"></div>
  <div id="draft"></div>
  <div class="log" id="log"></div>

  <script src="js/data.js"></script>
  <script src="js/round.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
